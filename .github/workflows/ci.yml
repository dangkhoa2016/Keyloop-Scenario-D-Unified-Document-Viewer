name: ci
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - run: python -m unittest discover -s tests/python -v
      - run: python -m pip install --disable-pip-version-check nbformat==5.10.4
      - name: Verify generated notebook is reproducible
        run: |
          PYTHONWARNINGS=error python scripts/build-reviewer-notebook.py
          git diff --exit-code -- notebooks/Keyloop-Scenario-D-Kaggle-Demo.ipynb
      - run: git diff --check
